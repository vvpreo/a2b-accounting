name: release-latest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  build-macos-arm64:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      TAURI_BUNDLE_TARGET: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --lib --release

      - name: Build Tauri bundle
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: Stage release artifact
        id: stage
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_files=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          if [ ${#dmg_files[@]} -eq 0 ]; then
            echo "No DMG produced — bundling failed?" >&2
            ls -la src-tauri/target/aarch64-apple-darwin/release/bundle/ || true
            exit 1
          fi
          src="${dmg_files[0]}"
          dst="A2B-Finances-latest-arm64.dmg"
          cp "$src" "$dst"
          echo "dmg_path=$dst" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          ls -la "$dst"

      - name: Replace 'latest' release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DMG_PATH: ${{ steps.stage.outputs.dmg_path }}
          SHORT_SHA: ${{ steps.stage.outputs.short_sha }}
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest "$DMG_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest build (${SHORT_SHA})" \
            --notes "Auto-built from main @ ${GITHUB_SHA}.

          Install: see README → «Установка собранного DMG»." \
            --prerelease \
            --target "$GITHUB_SHA"

  # Telegram fan-out for the build outcome. Runs on a separate ubuntu runner
  # (cheaper than macOS) and uses `if: always()` so it fires for both success
  # and failure of the build job. Two repo secrets are expected:
  #   - TG_CICD_BOT     — Telegram bot token (`<bot_id>:<bot_hash>` format)
  #   - TG_ACCOUNTS     — comma-separated chat_ids to broadcast to
  # If either secret is missing the step exits 0 — handy for forks / contributors
  # who don't have notification access set up.
  notify:
    runs-on: ubuntu-latest
    needs: build-macos-arm64
    if: always()
    timeout-minutes: 3
    steps:
      - name: Send Telegram notification
        env:
          TG_CICD_BOT: ${{ secrets.TG_CICD_BOT }}
          TG_ACCOUNTS: ${{ secrets.TG_ACCOUNTS }}
          BUILD_RESULT: ${{ needs.build-macos-arm64.result }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FULL_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${TG_CICD_BOT:-}" ] || [ -z "${TG_ACCOUNTS:-}" ]; then
            echo "TG_CICD_BOT or TG_ACCOUNTS not set — skipping Telegram notification" >&2
            exit 0
          fi
          short_sha="${FULL_SHA:0:7}"
          # Three outcome buckets:
          #   success   — green tick, links to the rolling release;
          #   cancelled — yellow circle, just an FYI (typically caused by
          #               concurrency: cancel-in-progress when the next commit
          #               supersedes this run, not an actual error);
          #   anything else (failure / timed_out / skipped) — red cross.
          case "$BUILD_RESULT" in
            success)
              text="$(printf '✅ A2B Finances: latest сборка готова (%s)\nРелиз: %s/releases/tag/latest' "$short_sha" "$REPO_URL")"
              ;;
            cancelled)
              text="$(printf '🟡 A2B Finances: сборка отменена (%s) — обычно из-за нового коммита поверх\nЛоги: %s' "$short_sha" "$RUN_URL")"
              ;;
            *)
              text="$(printf '❌ A2B Finances: latest сборка упала (%s, result=%s)\nЛоги: %s' "$short_sha" "$BUILD_RESULT" "$RUN_URL")"
              ;;
          esac
          # Split TG_ACCOUNTS on commas and broadcast. Whitespace around each
          # entry is trimmed so the secret can be either "id1,id2" or
          # "id1, id2" without surprises. Failures on individual chats are
          # tolerated — we want the rest of the fan-out to still go through.
          IFS=',' read -ra accounts <<< "$TG_ACCOUNTS"
          fail_count=0
          for raw in "${accounts[@]}"; do
            chat="$(echo -n "$raw" | tr -d '[:space:]')"
            [ -z "$chat" ] && continue
            if ! curl -sS --fail \
              -X POST "https://api.telegram.org/bot${TG_CICD_BOT}/sendMessage" \
              -d "chat_id=${chat}" \
              --data-urlencode "text=${text}" \
              > /dev/null; then
              echo "Telegram delivery failed for chat ${chat}" >&2
              fail_count=$((fail_count + 1))
            fi
          done
          if [ "$fail_count" -gt 0 ]; then
            echo "::warning::Telegram delivery failed for ${fail_count} chat(s)"
          fi
