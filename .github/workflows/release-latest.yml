name: release-latest

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  build-macos-arm64:
    runs-on: macos-14
    timeout-minutes: 30
    env:
      TAURI_BUNDLE_TARGET: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --lib --release

      - name: Build Tauri bundle
        run: npm run tauri build -- --target aarch64-apple-darwin

      - name: Stage release artifact
        id: stage
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_files=(src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg)
          if [ ${#dmg_files[@]} -eq 0 ]; then
            echo "No DMG produced — bundling failed?" >&2
            ls -la src-tauri/target/aarch64-apple-darwin/release/bundle/ || true
            exit 1
          fi
          src="${dmg_files[0]}"
          dst="A2B-Finances-latest-arm64.dmg"
          cp "$src" "$dst"
          echo "dmg_path=$dst" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          ls -la "$dst"

      - name: Replace 'latest' release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DMG_PATH: ${{ steps.stage.outputs.dmg_path }}
          SHORT_SHA: ${{ steps.stage.outputs.short_sha }}
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create latest "$DMG_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Latest build (${SHORT_SHA})" \
            --notes "Auto-built from main @ ${GITHUB_SHA}.

          Install: see README → «Установка собранного DMG»." \
            --prerelease \
            --target "$GITHUB_SHA"
