name: docker-image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Frontend typecheck + build
        run: npm run build

      - name: Rust tests
        working-directory: server
        run: cargo test --lib

  build-push:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # QEMU is only a safety net: the Dockerfile cross-compiles on the
      # native build platform, so target-arch emulation is not on the hot path.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Docker Hub. Secrets to configure in the repo settings:
      #   DOCKERHUB_USERNAME — Docker Hub login (also the image namespace)
      #   DOCKERHUB_TOKEN    — access token with Read & Write scope
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tagging scheme: every main commit is published as the rolling `dev`
      # tag plus an immutable `sha-<commit>` tag. The `latest` tag is reserved
      # for the last *stable* build and is promoted by a separate process —
      # this workflow must never push it.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/a2b-accounting
          tags: |
            type=raw,value=dev
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
